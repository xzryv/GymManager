<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GymManager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <a class="logo" href="{{ url_for('home') }}">GymManager</a>
    <nav>
        <a href="{{ url_for('home') }}">Panel</a>
        <a href="{{ url_for('customers') }}">Klienci</a>
        <a href="{{ url_for('memberships') }}">Karnety</a>
        <a href="{{ url_for('trainers') }}">Trenerzy</a>
        <a href="{{ url_for('classes') }}">Zajęcia</a>
        <a href="{{ url_for('bookings') }}">Zapisy</a>
    </nav>
</header>
<main>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
<footer>GymManager · projekt edukacyjny</footer>
</body>
</html>
