{% extends "base.html" %}
{% block title %}Trenerzy{% endblock %}
{% block content %}
<h1>Trenerzy</h1>
<section class="panel">
    <h2>Dodaj trenera</h2>
    <form method="post" class="form-grid">
        <label>Imię i nazwisko<input name="name" required></label>
        <label>Specjalizacja<input name="specialty"></label>
        <button type="submit">Dodaj trenera</button>
    </form>
</section>
<section class="panel">
    <h2>Lista trenerów</h2>
    <table><tr><th>Imię i nazwisko</th><th>Specjalizacja</th></tr>
    {% for trainer in trainers %}
    <tr><td>{{ trainer.name }}</td><td>{{ trainer.specialty or '—' }}</td></tr>
    {% endfor %}</table>
</section>
{% endblock %}
